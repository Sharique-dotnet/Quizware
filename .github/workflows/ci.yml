name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

defaults:
  run:
    working-directory: QuizApp

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore QuizApp.slnx

      - name: Build (0 warnings treated as errors)
        run: dotnet build QuizApp.slnx --no-restore --configuration Release /warnaserror

      - name: Test
        run: dotnet test QuizApp.slnx --no-build --configuration Release --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: QuizApp/TestResults

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 10.*

      - name: Migration drift check
        # Fails the build if a model change has no matching migration —
        # the exact P3-16 requirement.
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project src/QuizApp.Infrastructure \
            --startup-project src/QuizApp.Api
