name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

defaults:
  run:
    working-directory: Quizware

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Quizware.slnx

      - name: Build (0 warnings treated as errors)
        run: dotnet build Quizware.slnx --no-restore --configuration Release /warnaserror

      - name: Test
        run: dotnet test Quizware.slnx --no-build --configuration Release --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: Quizware/TestResults

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 10.*

      - name: Migration drift check
        # Fails the build if a model change has no matching migration —
        # the exact P3-16 requirement.
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project src/Quizware.Infrastructure \
            --startup-project src/Quizware.Api

  build-without-buzzer:
    # ADR-005 / Phase 14: the solution must build and every test must pass
    # with the optional buzzer module deleted entirely. Its own tests and the
    # BuzzerAgent go with it; nothing else may notice.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Delete the buzzer module
        run: |
          rm -rf src/Quizware.Modules.Buzzer tests/Quizware.Modules.Buzzer.Tests tools/Quizware.BuzzerAgent
          sed -i '/Quizware.Modules.Buzzer\|Quizware.BuzzerAgent/d' Quizware.slnx

      - name: Restore
        run: dotnet restore Quizware.slnx

      - name: Build (0 warnings treated as errors)
        run: dotnet build Quizware.slnx --no-restore --configuration Release /warnaserror

      - name: Test
        run: dotnet test Quizware.slnx --no-build --configuration Release

  secret-scan:
    # P15-02: no credential may ever be committed. Scans every commit with
    # gitleaks; reviewed false positives are listed in .gitleaksignore.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 git /repo --redact --no-banner --exit-code 1
